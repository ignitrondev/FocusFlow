# The Xcode project is generated from this file with XcodeGen (`xcodegen generate` in this
# folder), so no .xcodeproj is committed. Keep the versions in line with app/build.gradle.kts.
name: FocusFlow
options:
  bundleIdPrefix: com.ignitrondev
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "7"
    FOCUSFLOW_VERSION_NAME: "1.0.0-beta.4"
targets:
  FocusFlow:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ignitrondev.focusflow
        PRODUCT_NAME: FocusFlow
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The Kotlin framework built by Gradle (see the build phase below).
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
        # The Gradle build phase reads and writes outside the sandboxed script inputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: FocusFlow
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        FocusFlowVersionName: "$(FOCUSFLOW_VERSION_NAME)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Compose renders at up to 120 Hz on ProMotion screens.
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: FocusFlow uses the camera only when you take a photo for your shared statistics card.
        NSPhotoLibraryAddUsageDescription: FocusFlow saves your statistics card to Photos when you choose Save Image.
        ITSAppUsesNonExemptEncryption: false
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
