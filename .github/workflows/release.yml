#
# Builds the release APK and AAB for a `v*` tag and attaches them to the GitHub release.
#
# Signing uses repository secrets (see docs/DEVELOPMENT.md). Without them the workflow still
# builds and tests, uploads unsigned artifacts to the run, and leaves the GitHub release alone.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: 'zulu'
          cache: 'gradle'

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.FOCUSFLOW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are not configured: building unsigned artifacts only."
          fi

      - name: Tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Build release APK and AAB
        env:
          FOCUSFLOW_KEYSTORE_FILE: ${{ steps.signing.outputs.available == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          FOCUSFLOW_KEYSTORE_PASSWORD: ${{ secrets.FOCUSFLOW_KEYSTORE_PASSWORD }}
          FOCUSFLOW_KEY_ALIAS: ${{ secrets.FOCUSFLOW_KEY_ALIAS }}
          FOCUSFLOW_KEY_PASSWORD: ${{ secrets.FOCUSFLOW_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Collect artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          cp app/build/outputs/apk/release/*.apk "dist/FocusFlow-${version}.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/FocusFlow-${version}.aab"
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focusflow-release
          path: dist

      - name: Attach to the GitHub release
        if: steps.signing.outputs.available == 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "FocusFlow ${GITHUB_REF_NAME#v}" \
              --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
