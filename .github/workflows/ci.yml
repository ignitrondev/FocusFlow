# Formatting, lint, debug build and JVM tests. Needs no secrets.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # JDK 21 is required by Robolectric for the SDK 36 sandbox; app bytecode still targets 17.
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: 'zulu'
          cache: 'gradle'

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Check formatting
        run: ./gradlew spotlessCheck --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit and Robolectric UI tests
        run: ./gradlew :shared:testAndroidHostTest testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focusflow-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focusflow-reports
          path: app/build/reports

  # The shared (Kotlin Multiplatform) code on iOS: compiled with Kotlin/Native and tested on an
  # iPhone simulator. Needs macOS; the Linux job above cannot run iOS tests.
  ios-shared:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: 'zulu'
          cache: 'gradle'

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Shared tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Upload iOS test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focusflow-ios-test-reports
          path: shared/build/reports

  # The iOS app: built with Xcode, launched on an iPhone and an iPad simulator (screenshots are
  # uploaded), then built for devices without a signature. The unsigned .ipa is meant for
  # sideloading with AltStore or SideStore, which sign it with the tester's own Apple ID.
  ios-app:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: 'zulu'
          cache: 'gradle'

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project iosApp/FocusFlow.xcodeproj -scheme FocusFlow -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build | tee build/ios-simulator.log | tail -n 30

      - name: Run on iPhone and iPad simulators
        run: .github/scripts/ios-simulator-smoke.sh build/ios/Build/Products/Debug-iphonesimulator/FocusFlow.app ios-screenshots

      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focusflow-ios-screenshots
          path: ios-screenshots
          if-no-files-found: ignore

      - name: Build for devices (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project iosApp/FocusFlow.xcodeproj -scheme FocusFlow -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            | tee build/ios-device.log | tail -n 30
          if grep -q "built for newer iOS" build/ios-device.log; then
            grep "built for newer iOS" build/ios-device.log | head -n 5
            echo "::error::A linked library needs a newer iOS than the deployment target"
            exit 1
          fi

      - name: Package the .ipa
        run: |
          APP=build/ios/Build/Products/Release-iphoneos/FocusFlow.app
          echo "Minimum iOS version of the app binary:"
          otool -l "$APP/FocusFlow" | grep -A4 LC_BUILD_VERSION | grep minos
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry FocusFlow-ios-unsigned.ipa Payload)
          ls -l build/ipa/FocusFlow-ios-unsigned.ipa

      - name: Upload the unsigned .ipa
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focusflow-ios-unsigned-ipa
          path: build/ipa/FocusFlow-ios-unsigned.ipa
